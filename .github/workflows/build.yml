name: Build installers

# Runs when you push a version tag (e.g. v0.1.0) or when you click "Run workflow" on the Actions tab.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
            command: npm run dist:mac
          - os: windows-latest
            name: windows
            command: npm run dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Mac app contains both an Intel half and an Apple Silicon half.
      - name: Add the Intel image library (Mac only)
        if: matrix.name == 'mac'
        run: node scripts/add-mac-intel-libs.js

      - name: Run the converter tests
        continue-on-error: true  # a test hiccup in CI should not stop you getting installers
        if: matrix.name == 'mac'
        run: npm test

      - name: Build installers
        run: ${{ matrix.command }}
        env:
          # Unsigned builds: never try to find a signing certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: Converto-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  # When you push a tag like v0.1.0, also attach the installers to a GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          draft: true
